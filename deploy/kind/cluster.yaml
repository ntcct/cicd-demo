kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cicd-demo
nodes:
  - role: control-plane
    # Label required by the NGINX ingress "kind" manifest's nodeSelector.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Map host 80/443 into the cluster so http://*.cicd-demo.localtest.me works.
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
