apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stage

resources:
  - ../../base
  - ingress.yaml

# Stage runs the SAME immutable image that was validated in dev. Promotion means
# copying dev's tested newTag here deliberately — never rebuilding per environment.
images:
  - name: ghcr.io/ntcct/cicd-demo
    newTag: sha-000000000000 # bumped by a deliberate stage-promotion step

replicas:
  - name: cicd-demo
    count: 2

patches:
  - target:
      kind: Deployment
      name: cicd-demo
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_ENV
          value: stage
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_VERSION
          value: stage
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOG_LEVEL
          value: info
