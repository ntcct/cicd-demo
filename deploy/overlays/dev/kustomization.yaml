apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base
  - ingress.yaml

images:
  - name: ghcr.io/ntcct/cicd-demo
    newTag: sha-154a00850fdc

replicas:
  - name: cicd-demo
    count: 1

patches:
  - target:
      kind: Deployment
      name: cicd-demo
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_ENV
          value: dev
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_VERSION
          value: dev
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOG_LEVEL
          value: debug
